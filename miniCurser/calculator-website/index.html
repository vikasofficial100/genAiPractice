<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" readonly />
        <div class="buttons">
            <!-- Scientific function row -->
            <button class="btn operator" data-value="Math.sin(">sin</button>
            <button class="btn operator" data-value="Math.cos(">cos</button>
            <button class="btn operator" data-value="Math.tan(">tan</button>
            <button class="btn operator" data-value="Math.log10(">log</button>

            <!-- Second scientific row -->
            <button class="btn operator" data-value="Math.sqrt(">sqrt</button>
            <button class="btn operator" data-value="**">^</button>
            <button class="btn operator" data-value="(">(</button>
            <button class="btn operator" data-value=")">)</button>

            <!-- Constants row -->
            <button class="btn operator" data-value="Math.PI">π</button>
            <button class="btn operator" data-value="Math.E">e</button>
            <button class="btn" data-value="%">%</button>
            <button class="btn operator" data-value="/">/</button>

            <!-- Standard calculator rows -->
            <button class="btn" data-value="7">7</button>
            <button class="btn" data-value="8">8</button>
            <button class="btn" data-value="9">9</button>
            <button class="btn operator" data-value="*">*</button>

            <button class="btn" data-value="4">4</button>
            <button class="btn" data-value="5">5</button>
            <button class="btn" data-value="6">6</button>
            <button class="btn operator" data-value="-">-</button>

            <button class="btn" data-value="1">1</button>
            <button class="btn" data-value="2">2</button>
            <button class="btn" data-value="3">3</button>
            <button class="btn operator" data-value="+">+</button>

            <button class="btn" data-value="0">0</button>
            <button class="btn" data-value=".">.</button>
            <button class="btn" id="clear">C</button>
            <button class="btn" id="equals" style="grid-column: span 4;">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
